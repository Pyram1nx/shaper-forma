<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shaper Forma font preview</title>
<style>
  @font-face { font-family: 'Shaper Forma'; src: url('ShaperForma-Regular.ttf?v=30') format('truetype'); }
  body { margin: 0; padding: 32px; background: #fdfdfe; color: #0a0a0b; font-family: 'Shaper Forma', sans-serif; }
  .row { margin: 0 0 28px; line-height: 1; white-space: nowrap; }
  .label { font: 12px -apple-system, sans-serif; color: #72757e; margin-bottom: 8px; }
  .big { font-size: 96px; }
  .mid { font-size: 64px; }
  .small { font-size: 28px; }
</style>
</head>
<body>
  <div class="label">Wordmark</div>
  <div class="row big">SHAPER FORMA</div>
  <div class="label">Alphabet</div>
  <div class="row mid">ABCDEFGHIJKLM</div>
  <div class="row mid">NOPQRSTUVWXYZ</div>
  <div class="label">Digits</div>
  <div class="row mid">0123456789</div>
  <div class="label">Lowercase maps to capitals</div>
  <div class="row mid">shaper forma</div>
  <div class="label">Small size</div>
  <div class="row small">The quick brown fox jumps over 0123456789</div>
</body>
</html>
